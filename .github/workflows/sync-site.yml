name: Sync to _site/

on:
  push:
    branches: [main]
    paths-ignore:
      - '_site/**'
      - '.github/**'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync published files to _site/
        run: |
          find . -name "*.html" \
            -not -path "./_site/*" \
            -not -path "./.git/*" \
            -not -path "./_archived_posts/*" \
            -not -path "./_layouts/*" \
            -not -path "./_includes/*" \
          | while read f; do
            dest="_site/${f#./}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
            echo "Synced: $f → $dest"
          done
          # HTML-only sync left CSS/JS/images stale whenever assets changed.
          if [ -d assets ]; then
            rsync -a --delete assets/ _site/assets/
            echo "Synced: assets/ → _site/assets/"
          fi
          for f in robots.txt sitemap.xml CNAME favicon.ico; do
            if [ -f "$f" ]; then
              cp "$f" "_site/$f"
              echo "Synced: $f → _site/$f"
            fi
          done

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _site/
          git diff --staged --quiet && echo "Nothing to sync." || (
            git commit -m "Auto-sync _site/ from source [skip ci]"
            git push
          )

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4ec1f0e100565db185c280ea8a149600

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/6fb1c55ab6e5323225d2e372a9cc9c59/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}'
